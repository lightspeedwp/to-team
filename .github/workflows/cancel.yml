name: Cancel
on: pull_request
permissions:
  actions: write
jobs:
  cancel:
    name: 'Cancel Previous Runs'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Get all workflow ids and set to env variable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --jq '.workflows | map(.id|tostring) | join(",")')
          echo "WORKFLOW_IDS_TO_CANCEL=${ids}" >> "$GITHUB_ENV"

      - uses: styfle/cancel-workflow-action@0.13.1
        with:
          workflow_id: ${{ env.WORKFLOW_IDS_TO_CANCEL }}
          access_token: ${{ secrets.GITHUB_TOKEN }}
